# OpenClaw (openclaw/openclaw) — registry entry.
id: openclaw
name: OpenClaw
homepage: https://github.com/openclaw/openclaw
summary: Personal AI assistant + multi-channel gateway (WhatsApp/Telegram/Discord)
binary: openclaw
tags: [agent, cli, open, gateway]
install:
  method: npm
  source: openclaw@latest
  requires_node: ">=24.15" # Node 24.18.1 LTS baked into the base image
config:
  path: "~/.openclaw/openclaw.json"
  format: json5
  provider_key: OPENROUTER_API_KEY
setup:
  post_install: "openclaw onboard" # interactive daemon install; opt-in in containers
verify:
  - "openclaw --version"
  - "test -f ~/.openclaw/openclaw.json"
plugins: [skill, mcp, config, addon]
notes: Node >=24.15 (baked); ~/.openclaw/openclaw.json; agents/state/workspace relocate to scratch; openclaw agent headless
