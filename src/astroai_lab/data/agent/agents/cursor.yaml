# Cursor Agent CLI — registry entry.
# The on-disk binary remains `agent` (upstream name); the registry id is
# `cursor` so it matches plugins/setup.
id: cursor
name: Cursor Agent
homepage: https://cursor.com
summary: "Cursor's terminal coding agent CLI (binary name: agent)"
binary: agent
tags: [agent, cli]
install:
  method: curl
  source: https://cursor.com/install
  post_binary_paths:
    - "~/.local/bin/agent"
config:
  path: "~/.cursor/mcp.json"
  format: json
  markers:
    - "~/.cursor"
verify:
  - "agent --version"
plugins: [skill, mcp, config, addon, rule]
notes: "Upstream binary is `agent`. Chats/projects relocate to scratch; install with: astroai agent install cursor"
