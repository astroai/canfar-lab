# agent-home MCP — merged into ~/.codex/config.toml by scripts/install.sh

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true

[mcp_servers.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]
enabled = true

[mcp_servers.memory.env]
MEMORY_FILE_PATH = "${HOME}/.local/share/agent-home/memory.jsonl"

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
enabled = true

[mcp_servers.github.env]
GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_TOKEN}"

[mcp_servers.fetch]
command = "uvx"
args = ["mcp-server-fetch"]
enabled = true

[mcp_servers.overleaf]
command = "npx"
args = ["-y", "@mjyoo2/overleaf-mcp"]
enabled = true

[mcp_servers.overleaf.env]
OVERLEAF_PROJECTS_CONFIG = "${HOME}/.config/overleaf-mcp/projects.json"
