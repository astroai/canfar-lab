# Installable via: astroai agent install swival
id: swival
name: Swival
homepage: https://pypi.org/project/swival/
summary: Swival coding agent CLI (uv tool)
binary: swival
tags:
- agent
- cli
install:
  method: uv-tool
  source: swival
config:
  path: "~/.config/swival/astroai-notes.md"
  format: markdown
  provider_key: OPENROUTER_API_KEY
verify:
- swival --version
plugins:
- skill
- mcp
- config
- addon
