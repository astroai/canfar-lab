# Installable via: astroai agent install freebuff
id: freebuff
name: Freebuff
homepage: https://www.npmjs.com/package/freebuff
summary: Freebuff coding agent CLI
binary: freebuff
tags:
- agent
- cli
install:
  method: npm
  source: freebuff@latest
config:
  path: "~/.config/freebuff/astroai-notes.md"
  format: markdown
  provider_key: OPENROUTER_API_KEY
  markers:
    - "~/.config/manicode"
    - "~/.config/manicode/credentials.json"
version:
  args: ["-v"]
verify:
- freebuff -v
plugins:
- skill
- mcp
- config
- addon
