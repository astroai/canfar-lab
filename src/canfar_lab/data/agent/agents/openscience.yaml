# OpenScience (synthetic-sciences/openscience) — registry entry.
# The AstroAI openscience session image bakes a CANFAR build into /opt/openscience
# (web workspace behind the session proxy); other images install the npm release
# for `openscience run`.
id: openscience
name: OpenScience
homepage: https://github.com/synthetic-sciences/openscience
summary: Open-source AI research workspace (notebook kernels, skills, MCP) with CANFAR astronomy tools
binary: openscience
tags: [agent, cli, open, science]
install:
  method: npm
  source: "@synsci/openscience@2.0.143"
config:
  path: "~/.config/openscience/openscience.json"
  format: json
  # Each of these alone unlocks models in OpenScience.
  provider_keys:
    - OPENROUTER_API_KEY
    - OPENCODE_API_KEY
    - DEEPSEEK_API_KEY
    - GEMINI_API_KEY
    - OPENAI_API_KEY
    - ANTHROPIC_API_KEY
verify:
  - "openscience --version"
  - "test -f ~/.config/openscience/openscience.json"
plugins: [skill, mcp, config]
notes: >-
  Launch the openscience session for the web workspace; elsewhere run
  `openscience run "…"` in a terminal. Uses the model keys saved in the AstroAI
  hub; `canfar-lab agent setup openscience` adds the astroai MCP (Ray compute +
  CADC/VO data tools), a CANFAR primer and astronomy skills.
