[project]
name = "canfar-lab"
version = "0.7.0"
description = "In-session workbench and workload CLI extensions for the CANFAR Science Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Simon Fabbro", email = "simon.fabbro@nrc-cnrc.gc.ca" }]
keywords = ["astroai", "canfar", "science-platform", "astronomy", "session"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "httpx>=0.28.1",
    "canfar>=1.4.1",
    "tomli>=2.4.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[project.urls]
Homepage = "https://github.com/astroai/canfar-lab"
Documentation = "https://github.com/astroai/canfar-lab/blob/main/docs/USAGE.md"
Repository = "https://github.com/astroai/canfar-lab"
Issues = "https://github.com/astroai/canfar-lab/issues"
Platform = "https://opencadc.github.io/canfar/"

[project.scripts]
canfar-lab = "canfar_lab.cli.main:main_entry"

[project.entry-points."canfar.commands"]
lab = "canfar_lab.cli.main:lab_app"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canfar_lab", "src/canfar_workload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=canfar_lab --cov=canfar_workload --cov-report=term-missing --cov-fail-under=73"

[tool.coverage.run]
source = ["src/canfar_lab", "src/canfar_workload"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb", "src/canfar_lab/data/notebooks/starter.py", "templates", "skills", "rules", "instructions", "agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "BLE", "SIM", "PIE"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = "3.13.*"
pydantic = ">=2.13.5"
pydantic-settings = ">=2.15.0"
pyyaml = ">=6.0.3"
rich = ">=15.0.0"
typer = ">=0.27.2"
httpx = ">=0.28.1"
pytest = ">=9.1.1"
pytest-cov = ">=7.1.0"
ruff = ">=0.16.10"
ty = ">=0.0.84"
tomli = ">=2.4.1"

[tool.pixi.pypi-dependencies]
canfar-lab = { path = ".", editable = true }
canfar = ">=1.4.1"

[tool.pixi.tasks]
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "ty check --python .pixi/envs/default/bin/python src/canfar_lab"
cli-audit = "bash scripts/audit-cli-help.sh"
test = "pytest -q"
ci = "pixi run lint && pixi run format-check && pixi run typecheck && pixi run cli-audit && pixi run test"
