[project]
name = "astroai-lab"
version = "0.5.0"
description = "In-session workbench CLI for AstroAI sessions on the CANFAR Science Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Simon Fabbro", email = "simon.fabbro@nrc-cnrc.gc.ca" }]
keywords = ["astroai", "canfar", "science-platform", "astronomy", "session"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "pydantic>=2.9.2",
    "pydantic-settings>=2.9.1",
    "pyyaml>=6.0.2",
    "rich>=13.9.4",
    "typer>=0.16.0",
    "httpx>=0.27",
    "canfar>=1.4.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "ty>=0.0.65",
]

[project.urls]
Homepage = "https://github.com/astroai/canfar-lab"
Documentation = "https://github.com/astroai/canfar-lab/blob/main/docs/USAGE.md"
Repository = "https://github.com/astroai/canfar-lab"
Issues = "https://github.com/astroai/canfar-lab/issues"
Platform = "https://opencadc.github.io/canfar/"

[project.scripts]
astroai = "astroai_lab.cli.main:main_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astroai_lab", "src/astroai_workload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=astroai_lab --cov=astroai_workload --cov-report=term-missing --cov-fail-under=73"

[tool.coverage.run]
source = ["src/astroai_lab", "src/astroai_workload"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb", "src/astroai_lab/data/notebooks/starter.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "BLE", "SIM", "PIE"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = "3.13.*"
pydantic = ">=2.9.2"
pydantic-settings = ">=2.9.1"
pyyaml = ">=6.0.2"
rich = ">=13.9.4"
typer = ">=0.16.0"
httpx = ">=0.27"
pytest = ">=8.3.0"
pytest-cov = ">=6.0.0"
ruff = ">=0.8.0"
ty = ">=0.0.65"
tomli = ">=2.0"

[tool.pixi.pypi-dependencies]
astroai-lab = { path = ".", editable = true }
canfar = ">=1.4.1"

[tool.pixi.tasks]
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "ty check src/astroai_lab"
cli-audit = "bash scripts/audit-cli-help.sh"
test = "pytest -q"
ci = "pixi run lint && pixi run format-check && pixi run typecheck && pixi run cli-audit && pixi run test"
