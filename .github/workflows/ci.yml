name: CI

# Remote gate mirroring ./scripts/ci.sh: ruff, ty, CLI audit, pytest.
# Run ./scripts/ci.sh locally before pushing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The test job only checks out and runs checks; it never writes back to
# the repo, so restrict the GITHUB_TOKEN to read-only contents.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Lockfile integrity — pixi install --frozen
        # Hard-fail on lockfile drift: --frozen refuses to touch pixi.lock
        # and errors if the manifest changed without re-locking.
        run: pixi install --frozen

      - name: Ruff check
        run: pixi run lint

      - name: Ruff format
        run: pixi run format-check

      - name: ty typecheck
        run: pixi run typecheck

      - name: CLI audit
        run: pixi run cli-audit

      - name: Pytest
        run: pixi run test