# Installable via: canfar lab agent install agy
id: agy
name: Antigravity CLI
homepage: https://antigravity.google
summary: Google Antigravity coding agent CLI (agy)
binary: agy
tags:
- agent
- cli
install:
  method: curl
  source: https://antigravity.google/cli/install.sh
  post_binary_paths:
  - ~/.local/bin/agy
config:
  path: ~/.gemini/antigravity-cli/settings.json
  format: json
  markers:
  - ~/.gemini/antigravity-cli
verify:
- agy --version
plugins:
- skill
- mcp
- config
- addon
notes: Settings at ~/.gemini/antigravity-cli/; login tokens live in the OS keyring.
