# Installable via: astroai agent install copilot
id: copilot
name: GitHub Copilot CLI
homepage: https://docs.github.com/en/copilot/github-copilot-in-the-cli
summary: GitHub Copilot terminal coding agent (copilot)
binary: copilot
tags:
- agent
- cli
install:
  method: npm
  source: '@github/copilot@latest'
config:
  path: ~/.copilot/mcp-config.json
  format: json
  markers:
    - ~/.copilot
version:
  args: ["--version", "--no-auto-update"]
verify:
- copilot --version
plugins:
- skill
- mcp
- config
- addon
