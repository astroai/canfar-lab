# AstroAI-supported LLM routers and agents (panel + agent CLI).
# Routers are a key catalog only: id <-> env key mapping for credential
# discovery. astroai never presets providers or models — the user chooses
# those in dsh Settings → Models (`~/.dsh/settings.yaml`).
#
# `dsh_route` is the provider id written into ~/.dsh/settings.yaml, which is not
# always `id`: dsh resolves routes from its installed provider catalog
# (`openai`, `anthropic`, `google`, `deepseek-official`), so an AstroAI name like
# `openai-official` has to be written as `openai`. A route the catalog does not
# ship (`opencode-go`) is hand-declared and must state `api` and `base_url`.
# Its models catalog is fetched live at prepare (`GET {base_url}/models`); the
# yaml `models` list is an offline fallback only. That catalog is not a
# default: astroai never writes `agent-default-model`; the user still picks
# provider/model in Settings.

routers:
  - id: opencode-go
    key: OPENCODE_API_KEY
    dsh_route: opencode-go
    api: openai-completions
    # OpenCode Go gateway (not zen/v1 pay-as-you-go). Wrong host → INVALID_REQUEST
    # "Model is unavailable" even when the model id is right.
    base_url: https://opencode.ai/zen/go/v1
    # Offline fallback only. `astroai studio --prepare` replaces this with
    # GET {base_url}/models whenever the endpoint is reachable.
    models:
      - deepseek-v4.1-flash
      - deepseek-flash
      - deepseek-v4-pro
      - muse-spark-1.3-contributor
    notes: "OpenCode Go (OpenAI-compatible). Prepare seeds the route without the key; paste OPENCODE_API_KEY in Settings after Connect. Studio also installs dsh-opencode-session so chats send x-opencode-session."

  - id: deepseek-official
    key: DEEPSEEK_API_KEY
    dsh_route: deepseek-official
    notes: "Served by dsh's own DeepSeek adapter."

  - id: google
    key: GEMINI_API_KEY
    dsh_route: google
    notes: "Catalog route `google`."

  - id: openai-official
    key: OPENAI_API_KEY
    dsh_route: openai
    notes: "Written as the catalog route `openai`."

  - id: anthropic-official
    key: ANTHROPIC_API_KEY
    dsh_route: anthropic
    notes: "Written as the catalog route `anthropic`."

agents:
  # Install/setup these for a full AstroAI laptop/session toolkit.
  recommended:
    - opencode
    - dsh
    - kilo
    - codex
    - claude
    - cursor
    - muse
    - goose
    - cline
  panel:
    - dsh
