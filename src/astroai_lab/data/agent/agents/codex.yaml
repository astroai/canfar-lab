# Codex CLI (openai/codex) — registry entry.
# Use the package archive (not the bare binary): it includes
# codex-code-mode-host + bundled bwrap under the canonical layout.
id: codex
name: Codex CLI
homepage: https://github.com/openai/codex
summary: Lightweight OpenAI Codex & OpenRouter coding assistant
binary: codex
tags: [agent, cli]
install:
  method: gh-release
  repo: openai/codex
  asset: "codex-package-{arch}-unknown-linux-musl.tar.gz" # {arch} = x86_64 | aarch64
  requires_gh_auth: false
config:
  path: "~/.codex/config.toml"
  format: toml
  provider_key: OPENROUTER_API_KEY
verify:
  - "codex --version"
  - "test -f ~/.codex/config.toml"
  - "command -v codex-code-mode-host"
plugins: [skill, mcp, config, addon]
notes: >-
  Public package release (no gh login). Install lands bin/codex next to
  codex-code-mode-host and puts packaged bwrap on PATH.
