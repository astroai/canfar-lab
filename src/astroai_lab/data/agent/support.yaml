# AstroAI-supported LLM routers and agents (panel + agent CLI).
# Preference order for panel headless = routers list order.

routers:
  - id: opencode-go
    key: OPENCODE_API_KEY
    panel_default: deepseek-v4.1-flash
    panel_models:
      - deepseek-v4.1-flash
      - deepseek-v4-pro
      - deepseek-v4-flash
      - deepseek-v4-flash-vision-exp
    notes: "OpenCode Zen / Console Go. Headless may need session header; prefer DeepSeek official for one-shot."

  - id: deepseek-official
    key: DEEPSEEK_API_KEY
    panel_default: deepseek-flash
    panel_models:
      - deepseek-v4-pro
      - deepseek-v4-flash
      - deepseek-flash
      - deepseek-v4-flash-vision-exp
    notes: "Best for headless panel run."

  - id: google
    key: GEMINI_API_KEY
    panel_default: gemini-2.5-flash
    panel_models:
      - gemini-2.5-pro
      - gemini-2.5-flash
    notes: "Requires role remaps in the preset when this route wins."

  - id: openai-official
    key: OPENAI_API_KEY
    panel_default: gpt-5-mini
    panel_models:
      - gpt-5-mini
      - gpt-5
    notes: ""

  - id: anthropic-official
    key: ANTHROPIC_API_KEY
    panel_default: claude-haiku-4-5
    panel_models:
      - claude-haiku-4-5
      - claude-sonnet-4-5
    notes: ""

# Role pins for the AstroAI Panel preset (toolName ask_<role>).
# Values are model ids on the active router; missing keys fall back to panel_default.
panel_roles:
  statistician:
    opencode-go: deepseek-v4-pro
    deepseek-official: deepseek-v4-pro
    google: gemini-2.5-pro
