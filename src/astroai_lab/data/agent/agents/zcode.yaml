# ZCode CLI (zcode-app-cli) — unofficial terminal client for Z.AI ZCode runtime.
id: zcode
name: ZCode CLI
homepage: https://github.com/kingsword09/zcode-cli
summary: Unofficial terminal client for the Z.AI ZCode / GLM agent runtime
binary: zcode
tags: [agent, cli, open, glm]
install:
  method: npm
  source: zcode-app-cli@latest
config:
  path: "~/.config/zcode/astroai-notes.md"
  format: markdown
  markers:
    - "~/.zcode"
    - "~/.zcode/cli"
version:
  args: ["--version"]
  env:
    ZCODE_DISABLE_UPDATE_CHECK: "1"
    NO_UPDATE_NOTIFIER: "1"
verify:
  - "zcode --version"
plugins: [skill, mcp, config, addon]
notes: npm package zcode-app-cli; run `zcode` after install. Config is created on first launch.
