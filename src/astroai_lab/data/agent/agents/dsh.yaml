# Installable via: astroai agent install dsh
id: dsh
name: DeepSeek Harness
homepage: https://github.com/deepseek-ai/deepseek-harness
summary: DeepSeek Harness CLI (dsh) + review-bench preset
binary: dsh
tags: [agent, cli]
install:
  method: npm
  source: "@deepseek-ai/dsh@0.1.5-rc.2"
config:
  path: "~/.dsh/settings.yaml"
  format: yaml
  markers:
    - "~/.dsh"
verify:
  - dsh --version
plugins: [skill, mcp, config]
notes: >-
  Studio Team / review-bench via `astroai agent setup` into
  ~/.astroai/lab/review-bench and ~/.dsh/profiles/web/cordis.patch.yml.
  Coding UI: `astroai studio` (own profile `astroai`, see docs/studio.md) or
  image astroai/studio. Headless Team: `astroai panel run`.
